services:
  - type: web
    name: patient-registration-api
    runtime: python
    plan: starter
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: DATABASE_URL
        fromDatabase:
          name: patient-db
          property: connectionString
      - key: VAPI_WEBHOOK_SECRET
        generateValue: true
      - key: VAPI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: PYTHONUNBUFFERED
        value: "1"

databases:
  - name: patient-db
    plan: basic-256mb
    postgresMajorVersion: "16"
    region: oregon
    databaseName: patients
    user: patients
